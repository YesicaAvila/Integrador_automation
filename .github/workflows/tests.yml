name: CI - Pruebas Automatizadas

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-html selenium requests faker

      - name: Ejecutar pruebas y generar reporte HTML
        env:
          CI: "true"
        run: |
          mkdir -p integrador/reports integrador/screenshots
          pytest -v --html=integrador/reports/reporte.html --self-contained-html

      - name: Subir reporte y logs como artefactos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-y-logs
          path: |
            integrador/reports/reporte.html
            integrador/reports/ejecucion.log
            integrador/screenshots/
          if-no-files-found: ignore
